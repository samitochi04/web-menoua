<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menoua</title>
  <meta name="description" content="Menoua legal and support pages.">
  <style>
    :root{--ink:#0B1F27;--body:#3C5560;--muted:#7B939D;--bg:#F5F6F7;--card:#fff;--teal:#0F8B8D;--petrol:#143642}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--body);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    main{max-width:720px;margin:0 auto;padding:72px 22px 96px}
    .card{background:var(--card);border-radius:18px;padding:32px;box-shadow:0 1px 2px rgba(11,31,39,.05),0 8px 24px rgba(11,31,39,.05)}
    .mark{display:flex;align-items:center;gap:10px;color:var(--petrol);font-weight:700;letter-spacing:.14em;font-size:12px;margin-bottom:28px}
    h1{margin:0 0 10px;color:var(--ink);font-size:36px;line-height:1.15}
    p{margin:0 0 24px}
    a{color:var(--teal);font-weight:600}
    ul{padding-left:20px}
    li{margin:10px 0}
    footer{margin-top:28px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="mark">MENOUA</div>
      <h1>Menoua</h1>
      <p>Pronunciation training for spoken English.</p>
      <ul>
        <li><a href="/privacy.html">Privacy Policy</a></li>
        <li><a href="/terms.html">Terms of Service</a></li>
      </ul>
      <footer>© Menoua</footer>
    </div>
  </main>
</body>
</html>
